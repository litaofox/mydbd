server {
    listen 8090;
    server_name _;

    client_max_body_size 220m;

    # SPA 入口禁止缓存，保证发版后浏览器立即拿到引用最新 hash chunk 的 index.html
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 前端静态资源（Vue3 SPA）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Python 处理服务（模拟器 / 接入 / 视频分析）
    location /api/simulator/ {
        proxy_pass http://processing-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /api/ingest/ {
        proxy_pass http://processing-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # F22 驾驶评分（Java module-analysis；比 /api/analysis/ 更长前缀，优先匹配）
    location /api/analysis/score/ {
        proxy_pass http://platform-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # F23 风险趋势与画像（Java platform-app）——比 /api/analysis/（Python 视频分析）更长前缀
    location /api/analysis/profile/ {
        proxy_pass http://platform-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /api/analysis/ {
        proxy_pass http://processing-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # vps 网关接入状态 / 鉴权取附件（Python 处理服务）
    location /api/gateway/ {
        proxy_pass http://processing-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # WebSocket 实时推送
    location /ws/ {
        proxy_pass http://platform-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Java 平台（其余 /api/**）
    location /api/ {
        proxy_pass http://platform-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
