name: mydbd

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    command: >
      postgres -c shared_buffers=512MB -c work_mem=4MB -c max_wal_size=1GB
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  platform-app:
    build: ./backend-java
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      AMAP_KEY: ${AMAP_KEY:-}
      JAVA_OPTS: "-Xmx640m -XX:+UseG1GC"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 768M, cpus: "1.0" }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  processing-app:
    build: ./processing-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      STORAGE_ROOT: /data
      PYTHONUNBUFFERED: "1"
      # vps 网关对接（三模式：simulator 默认 / mock 仿真验证 / gateway 正式）
      GATEWAY_MODE: ${GATEWAY_MODE:-simulator}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-mydbd-ingest}
      GATEWAY_FILE_BASE_URL: ${GATEWAY_FILE_BASE_URL:-}
      GATEWAY_MEDIA_STRATEGY: ${GATEWAY_MEDIA_STRATEGY:-local}
      MEDIA_STORE_DIR: /data/media
    volumes:
      - mydbd-data:/data
      - ./samples:/data/samples:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 384M, cpus: "1.0" }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # 本地联调用单节点 KRaft Kafka（仅 dev-infra profile 显式启用，不影响默认启动）
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["dev-infra"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: mydbd-dev-kafka-cluster-001
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }
    restart: unless-stopped

  portal-nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infra/nginx/portal.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:8090"
    depends_on:
      platform-app: { condition: service_healthy }
      processing-app: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 64M, cpus: "0.2" }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8090/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  pg-data:
  mydbd-data:
